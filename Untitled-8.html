<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan Internal CSS</title>

  <style>
    /* Mengatur latar halaman menjadi biru muda */
    body {
      background-color: #E0F7FA;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
    }

    /* Mengatur judul utama: biru tua dan rata tengah */
    h1 {
      color: #006064;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Selamat Datang di Praktikum Pemrograman Web</h1>
  <p style="text-align: center;">
    Ini adalah contoh penerapan Internal CSS pada halaman HTML.
  </p>
</body>
</html>
