<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Sembako Amanah</title>
    <!-- Memanggil file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER & NAVIGASI -->
    <header>
        <h1>Toko Sembako Amanah</h1>
        <nav>
            <!-- Ini namanya Anchor Link  -->
            <a href="#tabel">Lihat Harga</a> | 
            <a href="#form">Pesan Barang</a>
            <a href="#input-barang">Input Barang</a>
        </nav>
    </header>

    <!-- BAGIAN TABEL HARGA -->
    <section id="tabel">
        <h2>Daftar Harga</h2>
        <table border="1">
            <tr>
                <th>Barang</th>
                <th>Harga</th>
                <th>Foto</th>
            </tr>
            <tr>
                <td>Beras</td>
                <td>Rp 60.000</td>
                <td><img src="beras.png" alt="Beras" width="100"></td>
            </tr>
            <tr>
                <td>Minyak</td>
                <td>Rp 30.000</td>
                <td><img src="minyak.png" alt="Minyak" width="100"></td>
            </tr>
            <tr>
                <td>Gula</td>
                <td>Rp 15.000</td>
            </tr>
            <tr>
                <td>Mie</td>
                <td>Rp 5.000</td>
            </tr>
        </table>
    </section>

    <!-- BAGIAN FORM PEMESANAN -->
    <section id="form">
        <h2>Form Pesanan</h2>
        
        <!-- Form ini memanggil fungsi dari JavaScript -->
        <form onsubmit="return validasi()">
            
            <label>Nama:</label><br>
            <input type="text" id="nama"><br><br>

            <label>Pilih Barang:</label><br>
            <select id="barang">
                <option value="">-- Pilih --</option>
                <option value="Beras">Beras</option>
                <option value="Minyak">Minyak</option>
            </select><br><br>

            <label>Metode:</label><br>
            <!-- Radio button (hanya bisa pilih 1) -->
            <input type="radio" name="kirim" value="Diantar"> Diantar
            <input type="radio" name="kirim" value="Ambil"> Ambil Sendiri
            <br><br>

            <!-- Tombol Submit -->
            <button type="submit">Kirim</button>
        </form>
    </section>

    <section id="input-barang">
        <h2>Input Barang</h2>
        <form onsubmit="return validasiInput()">
            <label>Nama Barang:</label><br>
            <input type="text" id="namaBarang"><br><br>

            <label>Harga Barang:</label><br>
            <input type="number" id="hargaBarang"><br><br>

            <button type="submit">Tambah Barang</button>
        </form>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>Toko Sembako Amanah</p>
    </footer>

    <!-- Memanggil file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
