<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Latihan Validasi Form</title>
</head>
<body>
<script>
function validateForm() {
  // Validasi required nama
  var nama = document.getElementById("nama").value;
  if (nama.trim() === "") {
    alert("Nama harus diisi");
    return false;
  }
  return true;
}
</script>
</body>
</html>
