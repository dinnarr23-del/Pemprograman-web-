<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Latihan Validasi Form</title>
</head>
<body>
<h2>Form Validasi</h2>
<form id="myForm" onsubmit="return validateForm()">
  <label>Nama:</label>
  <input type="text" id="nama"><br><br>

  <label>Email:</label>
  <input type="email" id="email"><br><br>

  <label>Umur:</label>
  <input type="number" id="umur"><br><br>

  <input type="submit" value="Kirim">
</form>
</body>
</html>
