<!DOCTYPE html>
<html>
<head>
    <title>Latihan JavaScript</title>
</head>
<body>
    <script>
function salam(nama) {
    return "Halo, " + nama + "!";
}

function tambah(a, b) {
    return a + b;
}

console.log(salam("Mahasiswa"));        // Halo, Mahasiswa!
console.log("Hasil:", tambah(5, 7));    // 12
    </script>
</body>
</html>
