<!DOCTYPE html>
<html>
<head>
    <title>Latihan JavaScript</title>
</head>
<body>
    <script>
let a = 10, b = 5;

// Aritmatika
console.log(a + b, a - b, a * b, a / b);

// Perbandingan
console.log(a > b);        // true
console.log(a == "10");    // true  (nilai sama, tipe diabaikan)
console.log(a === "10");   // false (nilai sama, tipe beda)

// Logika
let c = true, d = false;
console.log(c && d);  // AND → false
console.log(c || d);  // OR  → true
console.log(!c);      // NOT → false
    </script>
</body>
</html>
