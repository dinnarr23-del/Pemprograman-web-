<!DOCTYPE html>
<html>
<head>
    <title>Latihan JavaScript</title>
</head>
<body>
    <script>
let angka1 = 15, angka2 = 4;
console.log(angka1 % angka2);   // 3  (sisa bagi)
console.log(angka2 ** 2);       // 16 (pangkat)

let i = 0;
i++;                            // increment → 1
console.log(i);
    </script>
</body>
